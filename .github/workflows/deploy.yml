name: CI/CD — Build & Deploy

on:
  push:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # CI — Validate code before deploying (runs on GitHub's servers)
  # ─────────────────────────────────────────────────────────────────────────────
  ci:
    name: CI — Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Frontend build check ──────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ── Backend check ─────────────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Django system check
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-check-only-not-real
          DJANGO_DEBUG: "True"
          DB_HOST: localhost
          DB_NAME: code2day
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_PORT: "5432"
          JUDGE0_BASE_URL: http://localhost:2358
          JUDGE0_TIMEOUT_SECONDS: "30"
          REDIS_HOST: localhost
          REDIS_PASSWORD: ""
        run: python manage.py check --deploy 2>&1 | grep -v "^System check" || true

  # ─────────────────────────────────────────────────────────────────────────────
  # CD — Deploy directly on the server via self-hosted runner
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: CD — Deploy to Production
    runs-on: self-hosted
    needs: ci

    steps:
      - name: Deploy
        working-directory: /home/administrator/Desktop/doc_judge/judge0
        run: |
          set -e

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Code2Day Deploy — $(date)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # ── 1. Pull latest code ────────────────────────────────────────────
          echo "→ Pulling latest code..."
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          echo "✓ $(git log --oneline -1)"

          # ── 2. Build backend and frontend ──────────────────────────────────
          echo "→ Building images..."
          docker compose build backend frontend
          echo "✓ Images built"

          # ── 3. Restart containers ──────────────────────────────────────────
          echo "→ Restarting..."
          docker compose up -d --remove-orphans
          echo "✓ Containers up"

          # ── 4. Run migrations ──────────────────────────────────────────────
          echo "→ Migrations..."
          docker exec code2day-backend python manage.py migrate --noinput
          echo "✓ Migrations done"

          # ── 5. Collect static files ────────────────────────────────────────
          echo "→ Static files..."
          docker exec code2day-backend python manage.py collectstatic --noinput
          echo "✓ Done"

          # ── 6. Health check ────────────────────────────────────────────────
          sleep 8
          BACKEND=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/admin/)
          FRONTEND=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5001/)
          EXECUTOR=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:2358/health)

          echo "  Backend  → HTTP $BACKEND"
          echo "  Frontend → HTTP $FRONTEND"
          echo "  Executor → HTTP $EXECUTOR"

          if [ "$BACKEND" != "302" ] && [ "$BACKEND" != "200" ]; then
            echo "✗ Backend failed!" && exit 1
          fi
          if [ "$FRONTEND" != "200" ]; then
            echo "✗ Frontend failed!" && exit 1
          fi

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ✓ Deploy complete — $(date)"
          echo "  ✓ https://code2day.ramcoad.com"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
