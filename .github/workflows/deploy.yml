name: CI/CD — Build & Deploy

on:
  push:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # CI — Validate code before deploying (runs on GitHub's servers)
  # ─────────────────────────────────────────────────────────────────────────────
  ci:
    name: CI — Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      # ── Frontend build check ──────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ── Backend check ─────────────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Django system check
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-check-only-not-real
          DJANGO_DEBUG: "True"
          DB_HOST: localhost
          DB_NAME: code2day
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_PORT: "5432"
          JUDGE0_BASE_URL: http://localhost:2358
          JUDGE0_TIMEOUT_SECONDS: "30"
          REDIS_HOST: localhost
          REDIS_PASSWORD: ""
        run: python manage.py check --deploy 2>&1 | grep -v "^System check" || true

  # ─────────────────────────────────────────────────────────────────────────────
  # CD — Deploy directly on the server via self-hosted runner
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: CD — Deploy to Production
    runs-on: self-hosted
    needs: ci

    steps:
      - name: Deploy
        working-directory: /home/administrator/Desktop/doc_judge/judge0
        run: |
          set -e

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Code2Day Deploy — $(date)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # ── 1. Pull latest code ────────────────────────────────────────────
          echo "→ Pulling latest code..."
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          echo "✓ $(git log --oneline -1)"

          # ── 2. Build all images ────────────────────────────────────────────
          echo "→ Building app images..."
          docker compose build backend frontend code2day-executor
          echo "✓ App images built"

          echo "→ Building language sandbox images..."
          docker build -t code2day-python:latest ./code-executor/images/python/
          docker build -t code2day-node:latest   ./code-executor/images/node/
          docker build -t code2day-java:latest   ./code-executor/images/java/
          docker build -t code2day-c:latest      ./code-executor/images/c-cpp/
          docker build -t code2day-cpp:latest    ./code-executor/images/c-cpp/
          echo "✓ Language sandbox images built"

          # ── 3. Restart backend, frontend, and executor ─────────────────────
          echo "→ Restarting..."
          docker compose up -d --no-deps backend frontend code2day-executor
          echo "✓ Containers up"

          # ── 4. Run migrations ──────────────────────────────────────────────
          echo "→ Migrations..."
          docker exec code2day-backend python manage.py migrate --noinput
          echo "✓ Migrations done"

          # ── 5. Sync students from source DB (safe — skips if source unreachable) ──
          echo "→ Syncing students from source DB..."
          docker exec code2day-backend python manage.py import_students \
            && echo "✓ Student sync complete" \
            || echo "⚠ Student sync skipped (source DB unreachable — existing data unchanged)"

          echo "→ Ensuring institution + department mappings..."
          docker exec code2day-backend python manage.py setup_ramco_institution
          docker exec code2day-backend python manage.py setup_departments_and_map --institution-id 9536
          docker exec code2day-backend python manage.py seed_missing_students
          echo "✓ Institution, department mappings and missing students done"

          # ── 6. Collect static files ────────────────────────────────────────
          echo "→ Static files..."
          docker exec code2day-backend python manage.py collectstatic --noinput
          echo "✓ Done"

          # ── 7. Health check ────────────────────────────────────────────────
          sleep 8
          BACKEND=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/admin/)
          FRONTEND=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5001/)
          EXECUTOR=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:2358/health)

          echo "  Backend  → HTTP $BACKEND"
          echo "  Frontend → HTTP $FRONTEND"
          echo "  Executor → HTTP $EXECUTOR"

          if [ "$BACKEND" != "302" ] && [ "$BACKEND" != "200" ]; then
            echo "✗ Backend failed!" && exit 1
          fi
          if [ "$FRONTEND" != "200" ]; then
            echo "✗ Frontend failed!" && exit 1
          fi

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ✓ Deploy complete — $(date)"
          echo "  ✓ https://code2day.ramcoad.com"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
