name: CI/CD — Build & Deploy

on:
  push:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # CI — Validate code before deploying (runs on GitHub's servers)
  # ─────────────────────────────────────────────────────────────────────────────
  ci:
    name: CI — Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      # ── Frontend build check ──────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ── Backend check ─────────────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Django system check
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-check-only-not-real
          DJANGO_DEBUG: "True"
          DB_HOST: localhost
          DB_NAME: code2day
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_PORT: "5432"
          JUDGE0_BASE_URL: http://localhost:2358
          JUDGE0_TIMEOUT_SECONDS: "30"
          REDIS_HOST: localhost
          REDIS_PASSWORD: ""
        run: python manage.py check --deploy 2>&1 | grep -v "^System check" || true

  # ─────────────────────────────────────────────────────────────────────────────
  # CD — Deploy directly on the server via self-hosted runner
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: CD — Deploy to Production
    runs-on: self-hosted
    needs: ci

    steps:
      - name: Deploy
        working-directory: /home/administrator/Desktop/doc_judge/judge0
        run: |
          set -e

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Code2Day Deploy — $(date)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # ── 1. Pull latest code ────────────────────────────────────────────
          echo "→ Pulling latest code..."
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          echo "✓ $(git log --oneline -1)"

          # Each service is deployed from its own compose file — frontend,
          # backend, redis, and the executor are separately-scoped Dokploy
          # apps on the shared external network (code2day-shared), so no
          # single "docker compose up" should ever touch all of them at once.
          FRONTEND_COMPOSE="docker-compose.yml"
          BACKEND_COMPOSE="backend/docker-compose.yml"
          REDIS_COMPOSE="deploy/redis-compose.yml"
          EXECUTOR_COMPOSE="deploy/executor-compose.yml"

          # ── 2. Bring up redis + executor first (backend depends on both) ───
          echo "→ Starting redis and executor..."
          docker compose -f "$REDIS_COMPOSE" up -d
          docker compose -f "$EXECUTOR_COMPOSE" up -d
          echo "✓ Redis and executor up"

          # ── 3. Ensure Piston language packages ──────────────────────────────
          # Packages persist in the piston-data volume; only downloads on first run.
          echo "→ Ensuring Piston language packages..."
          PISTON_URL="http://localhost:2358/api/v2"

          # Wait for Piston to be ready (up to 60 s)
          for i in $(seq 1 30); do
            curl -sf "${PISTON_URL}/runtimes" > /dev/null 2>&1 && break
            echo "  Waiting for Piston... (${i}/30)"
            sleep 2
          done

          # NOTE: Piston has no package literally named "c" or "c++" — both are
          # provided by the single "gcc" package (see its metadata.json "provides"
          # array: language "c" aliased to "gcc", language "c++" aliased to "cpp"/
          # "g++"). Installing "gcc" registers BOTH "c" and "c++" as runtimes.
          install_if_missing() {
            PLANG="$1"
            PACKAGES_JSON=$(curl -sf "${PISTON_URL}/packages")

            if echo "$PACKAGES_JSON" | grep -qE "\"language\":\"${PLANG//+/\\+}\",\"language_version\":\"[^\"]*\",\"installed\":true"; then
              echo "  ✓ ${PLANG} already installed"
              return
            fi

            # The /packages install endpoint needs an EXACT version — "*" is only
            # valid on /execute. Resolve the version Piston's own index advertises.
            VERSION=$(echo "$PACKAGES_JSON" \
              | grep -oE "\"language\":\"${PLANG//+/\\+}\",\"language_version\":\"[^\"]*\"" \
              | head -1 | grep -oE '[^"]*"$' | tr -d '"')

            if [ -z "$VERSION" ]; then
              echo "  ⚠ ${PLANG}: not found in Piston's package index — skipping"
              return
            fi

            echo "  Installing ${PLANG}@${VERSION}..."
            RESP=$(curl -s --max-time 300 -w "\n%{http_code}" -X POST "${PISTON_URL}/packages" \
              -H "Content-Type: application/json" \
              -d "{\"language\":\"${PLANG}\",\"version\":\"${VERSION}\"}")
            CODE=$(echo "$RESP" | tail -1)
            BODY=$(echo "$RESP" | sed '$d')
            if [ "$CODE" = "200" ] || [ "$CODE" = "204" ]; then
              echo "  ✓ ${PLANG}@${VERSION} done"
            else
              echo "  ⚠ ${PLANG}@${VERSION} failed (HTTP ${CODE}): ${BODY} — retry next deploy"
            fi
          }

          install_if_missing python
          install_if_missing java
          install_if_missing gcc
          echo "✓ Piston packages ready"
          echo "  Installed runtimes: $(curl -sf "${PISTON_URL}/runtimes" | grep -oE '"language":"[^"]*","version":"[^"]*"' | tr '\n' ' ')"

          # ── 4. Build and start backend ───────────────────────────────────────
          # JUDGE0_BASE_URL is set directly in backend/docker-compose.yml, so
          # no .env patching is needed here.
          echo "→ Building and starting backend..."
          docker compose -f "$BACKEND_COMPOSE" build backend
          docker compose -f "$BACKEND_COMPOSE" up -d
          sleep 5
          echo "✓ Backend up"

          # ── 5. Build and start frontend ──────────────────────────────────────
          echo "→ Building and starting frontend..."
          docker compose -f "$FRONTEND_COMPOSE" build frontend
          docker compose -f "$FRONTEND_COMPOSE" up -d
          echo "✓ Frontend up"

          # ── 6. Run migrations ──────────────────────────────────────────────
          echo "→ Migrations..."
          docker exec code2day-backend python manage.py migrate --noinput
          echo "✓ Migrations done"

          # ── 7. Sync students from source DB (safe — skips if source unreachable) ──
          echo "→ Syncing students from source DB..."
          timeout 60 docker exec code2day-backend python manage.py import_students \
            && echo "✓ Student sync complete" \
            || echo "⚠ Student sync skipped (source DB unreachable — existing data unchanged)"

          echo "→ Ensuring institution + department mappings..."
          docker exec code2day-backend python manage.py setup_ramco_institution
          docker exec code2day-backend python manage.py setup_departments_and_map --institution-id 9536
          docker exec code2day-backend python manage.py seed_missing_students
          docker exec code2day-backend python manage.py seed_lab_data
          echo "✓ Institution, department mappings, missing students and lab data done"

          # ── 8. Collect static files ────────────────────────────────────────
          echo "→ Static files..."
          docker exec code2day-backend python manage.py collectstatic --noinput
          echo "✓ Done"

          # ── 9. Health check ────────────────────────────────────────────────
          sleep 8
          BACKEND=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/admin/)
          FRONTEND=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8001/)
          EXECUTOR=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:2358/api/v2/runtimes)

          echo "  Backend  → HTTP $BACKEND"
          echo "  Frontend → HTTP $FRONTEND"
          echo "  Executor → HTTP $EXECUTOR"

          if [ "$BACKEND" != "302" ] && [ "$BACKEND" != "200" ]; then
            echo "✗ Backend failed!" && exit 1
          fi
          if [ "$FRONTEND" != "200" ]; then
            echo "✗ Frontend failed!" && exit 1
          fi

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ✓ Deploy complete — $(date)"
          echo "  ✓ https://code2day.ramcoad.com"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
