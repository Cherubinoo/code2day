name: CI/CD — Build & Deploy

on:
  push:
    branches:
      - server

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # CI — Validate code before deploying (runs on GitHub's servers)
  # ─────────────────────────────────────────────────────────────────────────────
  ci:
    name: CI — Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      # ── Frontend build check ──────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ── Backend check ─────────────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Django system check
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-check-only-not-real
          DJANGO_DEBUG: "True"
          DB_HOST: localhost
          DB_NAME: code2day
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_PORT: "5432"
          JUDGE0_BASE_URL: http://localhost:2358
          JUDGE0_TIMEOUT_SECONDS: "30"
          REDIS_HOST: localhost
          REDIS_PASSWORD: ""
        run: python manage.py check --deploy 2>&1 | grep -v "^System check" || true

  # ─────────────────────────────────────────────────────────────────────────────
  # CD — Deploy directly on the server via self-hosted runner
  #
  # Requires backend/.env and .env (repo root) to already exist on the runner
  # at /home/administrator/Desktop/code2day_main — they hold real DB/email/API
  # credentials Dokploy manages separately from this repo (originally copied
  # from /etc/dokploy/compose/code2day-{backend,frontend}-*/code/**/.env) and
  # are gitignored, so `git reset --hard` here never touches or removes them.
  # Without them, docker compose silently defaults every credential to blank
  # and the backend fails to reach its database.
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: CD — Deploy to Production
    runs-on: self-hosted
    needs: ci

    steps:
      - name: Deploy
        working-directory: /home/administrator/Desktop/code2day_main
        run: |
          set -e

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Code2Day Deploy — $(date)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # ── 1. Pull latest code ────────────────────────────────────────────
          echo "→ Pulling latest code..."
          git fetch origin server
          git checkout server
          git reset --hard origin/server
          echo "✓ $(git log --oneline -1)"

          # Frontend and backend are each their own compose file/Dokploy app on
          # the shared external network (code2day-shared). The Judge0 execution
          # stack (judge0-server, judge0-workers, judge0-db, judge0-redis) is
          # long-running infra managed by docker-compose.judge0.yml — it is NOT
          # rebuilt on every app deploy, only ensured to be up, since it doesn't
          # change with application code.
          FRONTEND_COMPOSE="docker-compose.yml"
          BACKEND_COMPOSE="backend/docker-compose.yml"
          JUDGE0_COMPOSE="docker-compose.judge0.yml"

          # ── 2. Ensure the Judge0 execution stack is up (rarely changes, and is
          # independent infra from the app deploy below — its readiness is a
          # nice-to-have here, never a reason to block backend/frontend from
          # shipping, matching how the final health check in step 8 treats it) ──
          # Judge0's containers on this host were brought up by hand (docker run),
          # not by this compose file, so if they already exist (running or
          # stopped) `docker compose up` fails with a naming conflict instead of
          # adopting them. So: if they're healthy, leave them alone; if they
          # exist but are down, `docker start` them directly; only use compose
          # to create them when none of them exist at all.
          #
          # judge0-server in particular has a known intermittent boot bug (a
          # Rails classic-autoloader race that surfaces as a TSort::Cyclic error
          # — see conversation history / ops notes) that isn't caused by
          # anything this deploy does and isn't fixed by waiting or recreating
          # the container. Give it a reasonable chance to come up, but never
          # fail the whole deploy over it.
          JUDGE0_CONTAINERS="judge0-db judge0-redis judge0-server judge0-workers"
          echo "→ Checking Judge0 execution stack..."
          if curl -sf http://localhost:2358/system_info > /dev/null 2>&1; then
            echo "✓ Judge0 already up and healthy — leaving it alone"
          else
            EXISTING=""
            for c in $JUDGE0_CONTAINERS; do
              docker ps -a --format '{{.Names}}' | grep -qx "$c" && EXISTING="$EXISTING $c"
            done
            if [ -n "$EXISTING" ]; then
              echo "→ Judge0 not responding — starting existing containers:$EXISTING"
              for c in $EXISTING; do
                docker start "$c" > /dev/null 2>&1 || true
              done
            else
              echo "→ No existing Judge0 containers found — creating via compose..."
              docker compose -f "$JUDGE0_COMPOSE" up -d || true
            fi
            echo "→ Waiting for Judge0 to respond (best-effort, won't block the deploy)..."
            for i in $(seq 1 30); do
              curl -sf http://localhost:2358/system_info > /dev/null 2>&1 && break
              echo "  Waiting for Judge0... (${i}/30)"
              sleep 2
            done
            if curl -sf http://localhost:2358/system_info > /dev/null 2>&1; then
              echo "✓ Judge0 execution stack up"
            else
              echo "⚠ Judge0 still not responding — continuing deploy anyway (code execution"
              echo "  will be degraded until it stabilizes; check 'docker logs judge0-server')"
            fi
          fi

          # ── 3. Build and start backend ───────────────────────────────────────
          # Remove any container holding this name that Compose doesn't already
          # manage (e.g. one recreated by hand during a previous incident) —
          # otherwise `up -d` fails with "name already in use". Harmless no-op
          # when the running container is already the one Compose owns.
          echo "→ Building and starting backend..."
          docker compose -f "$BACKEND_COMPOSE" build backend
          docker rm -f code2day-backend > /dev/null 2>&1 || true
          docker compose -f "$BACKEND_COMPOSE" up -d
          sleep 5
          echo "✓ Backend up"

          # ── 4. Build and start frontend ──────────────────────────────────────
          echo "→ Building and starting frontend..."
          docker compose -f "$FRONTEND_COMPOSE" build frontend
          docker rm -f code2day-frontend > /dev/null 2>&1 || true
          docker compose -f "$FRONTEND_COMPOSE" up -d
          echo "✓ Frontend up"

          # ── 5. Run migrations ──────────────────────────────────────────────
          echo "→ Migrations..."
          docker exec code2day-backend python manage.py migrate --noinput
          echo "✓ Migrations done"

          # ── 6. Sync students from source DB (safe — skips if source unreachable) ──
          echo "→ Syncing students from source DB..."
          timeout 60 docker exec code2day-backend python manage.py import_students \
            && echo "✓ Student sync complete" \
            || echo "⚠ Student sync skipped (source DB unreachable — existing data unchanged)"

          echo "→ Ensuring institution + department mappings..."
          docker exec code2day-backend python manage.py setup_ramco_institution
          docker exec code2day-backend python manage.py setup_departments_and_map --institution-id 9536
          docker exec code2day-backend python manage.py seed_missing_students
          docker exec code2day-backend python manage.py seed_lab_data
          echo "✓ Institution, department mappings, missing students and lab data done"

          # ── 7. Collect static files ────────────────────────────────────────
          echo "→ Static files..."
          docker exec code2day-backend python manage.py collectstatic --noinput
          echo "✓ Done"

          # ── 8. Health check ────────────────────────────────────────────────
          # `curl` itself can fail (connection reset, timeout) rather than just
          # returning a bad HTTP code — under `set -e` that would abort the
          # whole script right here with a bare curl exit code and no output,
          # instead of the clear pass/fail below. Fall back to "000" so a
          # transient blip is just another failing status to report, and give
          # each endpoint a few retries since containers may still be warming up.
          check_http() {
            for i in 1 2 3 4 5; do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" "$1" || echo "000")
              [ "$CODE" = "200" ] || [ "$CODE" = "302" ] && break
              sleep 3
            done
            echo "$CODE"
          }
          sleep 8
          BACKEND=$(check_http http://localhost:8000/admin/)
          FRONTEND=$(check_http http://localhost:8001/)
          EXECUTOR=$(check_http http://localhost:2358/system_info)

          echo "  Backend  → HTTP $BACKEND"
          echo "  Frontend → HTTP $FRONTEND"
          echo "  Executor → HTTP $EXECUTOR"

          if [ "$BACKEND" != "302" ] && [ "$BACKEND" != "200" ]; then
            echo "✗ Backend failed!" && exit 1
          fi
          if [ "$FRONTEND" != "200" ]; then
            echo "✗ Frontend failed!" && exit 1
          fi

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ✓ Deploy complete — $(date)"
          echo "  ✓ https://code2day.ramcoad.com"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
