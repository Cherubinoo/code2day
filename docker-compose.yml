services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    image: code2day-frontend:latest
    container_name: code2day-frontend
    restart: unless-stopped
    ports:
      - "8001:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - VITE_API_TARGET=${VITE_API_TARGET}
    logging:
      driver: json-file
      options:
        max-size: 100M
    networks:
      - code2day-shared

networks:
  code2day-shared:
    external: true
  dokploy-network:
    external: true

