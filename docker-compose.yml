services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    image: code2day-frontend:latest
    container_name: code2day-frontend
    restart: unless-stopped
    ports:
      - "8001:80"
    logging:
      driver: json-file
      options:
        max-size: 100M
    networks:
      - code2day-shared

networks:
  code2day-shared:
    external: true
  dokploy-network:
    external: true

