x-logging:
  &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

services:

  # ── Judge0 Database ──────────────────────────────────────────────────────────
  judge0-db:
    image: postgres:13-alpine
    container_name: judge0-db
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: psql11042026
      POSTGRES_DB: judge0
    volumes:
      - judge0-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    <<: *default-logging
    networks:
      - code2day-network

  # ── Judge0 Redis ─────────────────────────────────────────────────────────────
  judge0-redis:
    image: redis:7-alpine
    container_name: judge0-redis
    command: redis-server --requirepass judge0redis --appendonly no
    volumes:
      - judge0-redis-data:/data
    restart: unless-stopped
    <<: *default-logging
    networks:
      - code2day-network

  # ── Judge0 Server (custom image with extra packages) ─────────────────────────
  judge0-server:
    build:
      context: ./judge0-custom
      dockerfile: Dockerfile
    image: code2day-judge0:latest
    container_name: judge0-server
    volumes:
      - ./judge0-ce/judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    restart: unless-stopped
    <<: *default-logging
    depends_on:
      - judge0-db
      - judge0-redis
    networks:
      - code2day-network

  # ── Judge0 Workers (same custom image, no extra build needed) ─────────────────
  judge0-workers:
    image: code2day-judge0:latest
    container_name: judge0-workers
    command: ["/api/scripts/workers"]
    volumes:
      - ./judge0-ce/judge0.conf:/judge0.conf:ro
    privileged: true
    restart: unless-stopped
    <<: *default-logging
    depends_on:
      - judge0-db
      - judge0-redis
      - judge0-server
    networks:
      - code2day-network

  # ── Django Backend (port 8000, always on) ────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    image: code2day-backend:latest
    container_name: code2day-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    restart: unless-stopped
    <<: *default-logging
    depends_on:
      - judge0-db
      - judge0-redis
      - judge0-server
    networks:
      - code2day-network
    command: gunicorn code2day.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120

  # ── React Frontend (port 5001, always on) ────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    image: code2day-frontend:latest
    container_name: code2day-frontend
    ports:
      - "5001:80"
    restart: unless-stopped
    <<: *default-logging
    networks:
      - code2day-network

volumes:
  judge0-db-data:
  judge0-redis-data:

networks:
  code2day-network:
    driver: bridge
