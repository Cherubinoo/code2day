services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    image: code2day-frontend:latest
    container_name: code2day-frontend
    restart: unless-stopped
    ports:
      - "8001:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_NAME=code2day
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - VITE_API_TARGET=https://code2day.ramcoad.com
    logging:
      driver: json-file
      options:
        max-size: 100M
    networks:
      - code2day-shared

networks:
  code2day-shared:
    external: true
  dokploy-network:
    external: true

