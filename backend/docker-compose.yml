services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: code2day-backend:latest
    container_name: code2day-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - code2day-backend-media:/app/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["/app/entrypoint.sh"]
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=false
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,code2day.ramcoad.com,ritcode.ramcoad.com,172.16.9.197,210.212.255.194
      - DB_NAME=code2day
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - JUDGE0_BASE_URL=http://judge0-server:2358
      - JUDGE0_TIMEOUT_SECONDS=300
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_API_BASE_URL=${LLM_API_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-deepseek-ai/deepseek-v4-pro}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-30}
      - LLM_API_KEY_2=${LLM_API_KEY_2}
      - LLM_API_BASE_URL_2=${LLM_API_BASE_URL_2:-https://integrate.api.nvidia.com/v1}
      - LLM_MODEL_NAME_2=${LLM_MODEL_NAME_2:-nvidia/nemotron-3-ultra-550b-a55b}
      - LLM_TIMEOUT_SECONDS_2=${LLM_TIMEOUT_SECONDS_2:-45}
      - CORS_ALLOWED_ORIGINS=http://localhost:8001,http://127.0.0.1:8001,https://code2day.ramcoad.com,https://ritcode.ramcoad.com
      - CSRF_TRUSTED_ORIGINS=https://code2day.ramcoad.com,https://ritcode.ramcoad.com,http://localhost:8001,http://127.0.0.1:8001
      - SESSION_COOKIE_SECURE=true
      - CSRF_COOKIE_SECURE=true
    logging:
      driver: json-file
      options:
        max-size: "100M"
    networks:
      - code2day-shared

volumes:
  code2day-backend-media:

networks:
  code2day-shared:
    external: true
