services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: code2day-backend:latest
    container_name: code2day-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - code2day-backend-media:/app/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "python manage.py migrate --noinput && gunicorn code2day.wsgi:application --bind 0.0.0.0:8000 --workers 12 --timeout 120 --max-requests 1000 --max-requests-jitter 100"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=false
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,code2day.ramcoad.com,ritcode.ramcoad.com,172.16.9.197,210.212.255.194
      - DB_NAME=code2day
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - JUDGE0_BASE_URL=http://code2day-executor:2358
      - JUDGE0_TIMEOUT_SECONDS=30
      - CORS_ALLOWED_ORIGINS=http://localhost:8001,http://127.0.0.1:8001,https://code2day.ramcoad.com,https://ritcode.ramcoad.com
      - CSRF_TRUSTED_ORIGINS=https://code2day.ramcoad.com,https://ritcode.ramcoad.com,http://localhost:8001,http://127.0.0.1:8001
      - SESSION_COOKIE_SECURE=true
      - CSRF_COOKIE_SECURE=true
    logging:
      driver: json-file
      options:
        max-size: "100M"
    networks:
      - code2day-shared

volumes:
  code2day-backend-media:

networks:
  code2day-shared:
    external: true
