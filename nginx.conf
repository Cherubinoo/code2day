# ============================================================
# Nginx config for code2day.ramcoad.com
# Place at: /etc/nginx/sites-available/code2day.ramcoad.com
#
# HTTP  → redirect to HTTPS
# HTTPS → frontend :8001, /api → backend :8000, /admin → backend :8000
# ============================================================

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name code2day.ramcoad.com;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name code2day.ramcoad.com;

    # SSL (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/code2day.ramcoad.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/code2day.ramcoad.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Logging
    access_log /var/log/nginx/code2day.access.log;
    error_log  /var/log/nginx/code2day.error.log warn;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Django Admin ──────────────────────────────────────────────────────────
    location = /admin/ {
        return 301 https://$host/admin;
    }

    location /admin/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 10M;
    }

    # ── Django REST API ───────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 300s, not the usual 120s — local LLM generation (LM Studio on the
        # LAN) runs far slower than the cloud APIs this was tuned for,
        # especially with concurrent requests sharing one GPU.
        proxy_read_timeout 300s;
        client_max_body_size 10M;
    }

    # ── Django static files ───────────────────────────────────────────────────
    location /static/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── React Frontend (catch-all) ────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
